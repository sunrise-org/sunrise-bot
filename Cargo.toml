[package]
name = "sunrise-bot"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Sunny, Sunrise's Discord bot"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[lints.clippy]
all = "warn"
