apiVersion: v1
kind: ConfigMap
metadata:
  name: bot
  namespace: sunrise
data:
  GUILD_ID: "1569116592132857946"
  DATABASE_PATH: /data/bot.sqlite
  HTTP_ADDR: 0.0.0.0:8080
  RELAY_ADDR: 0.0.0.0:50051
  CONFIG_DIR: /app/config
  RUST_LOG: info
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bot-data
  namespace: sunrise
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bot
  namespace: sunrise
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sunrise-bot
  template:
    metadata:
      labels:
        app: sunrise-bot
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: bot
          image: hub.umceko.com/sunrise/bot@sha256:1c3892c963dfa09d54429f504c506930b7cd19621f81f5126d4934f0d332b866
          ports:
            - containerPort: 8080
            - name: grpc
              containerPort: 50051
          envFrom:
            - configMapRef:
                name: bot
            - secretRef:
                name: bot
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
        # Discord is DPI-blocked on this network: nfqws desyncs the first packets of this pod's own HTTPS connections.
        - name: zapret
          image: ghcr.io/mxhist/zapret-tinyproxy:latest
          command:
            - /bin/sh
            - -c
            - >-
              set -e;
              iptables -t mangle -A POSTROUTING -p tcp --dport 443 -m connbytes --connbytes-dir=original --connbytes-mode=packets --connbytes 1:6
              -m mark ! --mark 0x40000000/0x40000000 -j NFQUEUE --queue-num 200 --queue-bypass;
              exec /opt/zapret/nfq/nfqws --qnum=200 --filter-tcp=443
              --dpi-desync=fake,multidisorder --dpi-desync-split-pos=1,midsld --dpi-desync-fooling=md5sig
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            capabilities:
              add: [NET_ADMIN, NET_RAW]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: bot-data
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: bot
  namespace: sunrise
spec:
  selector:
    app: sunrise-bot
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: grpc
      port: 50051
      targetPort: 50051
      appProtocol: kubernetes.io/h2c
