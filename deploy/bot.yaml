apiVersion: v1
kind: ConfigMap
metadata:
  name: bot
  namespace: sunrise
data:
  GUILD_ID: "1569116592132857946"
  DATABASE_PATH: /data/bot.sqlite
  HTTP_ADDR: 0.0.0.0:8080
  CONFIG_DIR: /app/config
  RUST_LOG: info
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bot-data
  namespace: sunrise
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bot
  namespace: sunrise
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sunrise-bot
  template:
    metadata:
      labels:
        app: sunrise-bot
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: bot
          image: hub.umceko.com/sunrise/bot:IMAGE
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: bot
            - secretRef:
                name: bot
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: bot-data
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: bot
  namespace: sunrise
spec:
  selector:
    app: sunrise-bot
  ports:
    - port: 8080
      targetPort: 8080
